<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huấn luyện viên - Admin GYMFINDER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../assets/admin.css">
</head>
<body class="d-flex">
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebarPlaceholder"></div>

    <!-- Main Content -->
    <main class="main-content d-flex flex-column h-100 min-vh-100">
        <div id="mobileHeaderPlaceholder"></div>

        <div class="p-4 p-md-5 flex-grow-1 overflow-auto">
            
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Quản lý huấn luyện viên</h2>
    <button class="btn btn-primary px-3 rounded-3" data-bs-toggle="modal" data-bs-target="#trainerFormModal"><i class="fa-solid fa-plus me-2"></i>Thêm mới</button>
</div>

<div class="admin-card p-3 mb-4">
    <div class="row g-3">
        <div class="col-12 col-md-5">
            <div class="position-relative">
                <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                <input type="text" class="form-control admin-input ps-5" placeholder="Tìm kiếm HLV...">
            </div>
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select admin-input">
                <option value="">Tất cả chuyên môn</option>
                <option value="Yoga">Yoga</option>
                <option value="Kickboxing">Kickboxing</option>
                <option value="Thể hình">Thể hình</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <select class="form-select admin-input">
                <option value="">Trạng thái</option>
                <option value="Hoạt động">Hoạt động</option>
            </select>
        </div>
        <div class="col-12 col-md-2">
            <button class="btn btn-light border w-100 text-secondary">Lọc</button>
        </div>
    </div>
</div>

<div class="admin-card overflow-hidden">
    <div class="table-responsive">
        <table class="table admin-table mb-0">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Huấn luyện viên</th>
                    <th>Chuyên môn</th>
                    <th>Phòng tập</th>
                    <th>Đánh giá</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="trainerTableBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
    <div class="p-3 border-top d-flex justify-content-between align-items-center">
        <span class="text-secondary small">Hiển thị 1-10 của 12 HLV</span>
        <ul class="pagination pagination-sm admin-pagination mb-0">
            <li class="page-item disabled"><a class="page-link" href="#"><i class="fa-solid fa-angle-left"></i></a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#"><i class="fa-solid fa-angle-right"></i></a></li>
        </ul>
    </div>
</div>

        </div>
    </main>

    <!-- Shared Modal -->
    <div class="modal fade" id="sharedAdminModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="sharedModalTitle">Modal Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="sharedModalBody">
                    ...
                </div>
                <div class="modal-footer border-top-0 pt-0" id="sharedModalFooter">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="sharedModalConfirm">Xác nhận</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Trainer Form Modal -->
    <div class="modal fade" id="trainerFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="trainerFormModalTitle">Thêm huấn luyện viên mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <form id="trainerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control admin-input" id="trainerNameInput" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Chuyên môn <span class="text-danger">*</span></label>
                                <input type="text" class="form-control admin-input" id="trainerSpecInput" placeholder="VD: Thể hình, Yoga" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Phòng tập liên kết <span class="text-danger">*</span></label>
                                <select class="form-select admin-input" id="trainerGymInput" required>
                                    <option value="">-- Chọn phòng tập --</option>
                                    <!-- Options will be populated by JS -->
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Kinh nghiệm</label>
                                <input type="text" class="form-control admin-input" id="trainerExpInput" placeholder="VD: 5 năm">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Số điện thoại liên hệ</label>
                                <input type="text" class="form-control admin-input" id="trainerPhoneInput">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Trạng thái</label>
                                <select class="form-select admin-input" id="trainerStatusInput">
                                    <option value="Hoạt động">Hoạt động</option>
                                    <option value="Tạm ẩn">Tạm ẩn</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Tiểu sử</label>
                                <textarea class="form-control admin-input" id="trainerBioInput" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveTrainerForm()">Lưu thông tin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Data -->
    <script src="../../data/categories.js"></script>
    <script src="../../data/gyms.js"></script>
    <script src="../../data/trainers.js"></script>
    <script src="../../data/users.js"></script>
    
    <!-- Admin Logic -->
    <script src="../assets/js/admin.js"></script>
</body>
</html>
