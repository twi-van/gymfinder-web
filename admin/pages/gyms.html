<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng tập - Admin GYMFINDER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../assets/admin.css">
</head>
<body class="d-flex">
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebarPlaceholder"></div>

    <!-- Main Content -->
    <main class="main-content d-flex flex-column h-100 min-vh-100">
        <div id="mobileHeaderPlaceholder"></div>

        <div class="p-4 p-md-5 flex-grow-1 overflow-auto">
            
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Quản lý phòng tập</h2>
    <button class="btn btn-primary px-3 rounded-3" data-bs-toggle="modal" data-bs-target="#gymFormModal"><i class="fa-solid fa-plus me-2"></i>Thêm mới</button>
</div>

<div class="admin-card p-3 mb-4">
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="position-relative">
                <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                <input type="text" class="form-control admin-input ps-5" placeholder="Tìm kiếm phòng tập...">
            </div>
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select admin-input">
                <option value="">Tất cả khu vực</option>
                <option value="Quận 1">Quận 1</option>
                <option value="Quận 3">Quận 3</option>
                <option value="Quận 4">Quận 4</option>
                <option value="Quận 5">Quận 5</option>
                <option value="Quận 6">Quận 6</option>
                <option value="Quận 7">Quận 7</option>
                <option value="Quận 8">Quận 8</option>
                <option value="Quận 10">Quận 10</option>
                <option value="Quận 11">Quận 11</option>
                <option value="Quận 12">Quận 12</option>
                <option value="Bình Tân">Bình Tân</option>
                <option value="Bình Thạnh">Bình Thạnh</option>
                <option value="Gò Vấp">Gò Vấp</option>
                <option value="Phú Nhuận">Phú Nhuận</option>
                <option value="Tân Bình">Tân Bình</option>
                <option value="Tân Phú">Tân Phú</option>
                <option value="TP Thủ Đức">TP Thủ Đức</option>
                <option value="Huyện Bình Chánh">Huyện Bình Chánh</option>
                <option value="Huyện Cần Giờ">Huyện Cần Giờ</option>
                <option value="Huyện Củ Chi">Huyện Củ Chi</option>
                <option value="Huyện Hóc Môn">Huyện Hóc Môn</option>
                <option value="Huyện Nhà Bè">Huyện Nhà Bè</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select admin-input">
                <option value="">Tất cả trạng thái</option>
                <option value="Hoạt động">Hoạt động</option>
                <option value="Tạm ẩn">Tạm ẩn</option>
            </select>
        </div>
        <div class="col-12 col-md-2">
            <button class="btn btn-light border w-100 text-secondary">Lọc</button>
        </div>
    </div>
</div>

<div class="admin-card overflow-hidden">
    <div class="table-responsive">
        <table class="table admin-table mb-0">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Phòng tập</th>
                    <th>Khu vực</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Đánh giá</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="gymTableBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
    <div class="p-3 border-top d-flex justify-content-between align-items-center">
        <span class="text-secondary small">Hiển thị 1-10 của 12 phòng tập</span>
        <ul class="pagination pagination-sm admin-pagination mb-0">
            <li class="page-item disabled"><a class="page-link" href="#"><i class="fa-solid fa-angle-left"></i></a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#"><i class="fa-solid fa-angle-right"></i></a></li>
        </ul>
    </div>
</div>

        </div>
    </main>

    <!-- Shared Modal -->
    <div class="modal fade" id="sharedAdminModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="sharedModalTitle">Modal Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="sharedModalBody">
                    ...
                </div>
                <div class="modal-footer border-top-0 pt-0" id="sharedModalFooter">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="sharedModalConfirm">Xác nhận</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Data -->
    <script src="../../data/categories.js"></script>
    <script src="../../data/gyms.js"></script>
    <script src="../../data/trainers.js"></script>
    <script src="../../data/users.js"></script>
    
    <!-- Admin Logic -->
    <script src="../assets/js/admin.js"></script>
</body>
</html>
    <!-- Gym Form Modal -->
    <div class="modal fade" id="gymFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="gymFormModalTitle">Thêm phòng tập mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <form id="gymForm">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold small">Tên phòng tập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control admin-input" id="gymNameInput" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">Khu vực <span class="text-danger">*</span></label>
                                <select class="form-select admin-input" id="gymDistrictInput" required>
                                    <option value="Quận 1">Quận 1</option>
                                    <option value="Quận 2">Quận 2</option>
                                    <option value="Quận 3">Quận 3</option>
                                    <option value="Quận 7">Quận 7</option>
                                    <option value="Bình Thạnh">Bình Thạnh</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Khoảng giá (VD: 300.000 - 500.000đ/tháng)</label>
                                <input type="text" class="form-control admin-input" id="gymPriceInput">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Trạng thái</label>
                                <select class="form-select admin-input" id="gymStatusInput">
                                    <option value="Hoạt động">Hoạt động</option>
                                    <option value="Tạm ẩn">Tạm ẩn</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Địa chỉ chi tiết</label>
                                <input type="text" class="form-control admin-input" id="gymAddressInput">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Mô tả phòng tập</label>
                                <textarea class="form-control admin-input" id="gymDescInput" rows="3"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Tiện ích nổi bật</label>
                                <div class="d-flex flex-wrap gap-3 mt-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="fac1" value="Điều hòa">
                                        <label class="form-check-label" for="fac1">Điều hòa</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="fac2" value="Phòng thay đồ">
                                        <label class="form-check-label" for="fac2">Phòng thay đồ</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="fac3" value="Tủ đồ">
                                        <label class="form-check-label" for="fac3">Tủ đồ</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="fac4" value="Bãi giữ xe">
                                        <label class="form-check-label" for="fac4">Bãi giữ xe</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveGymForm()">Lưu thông tin</button>
                </div>
            </div>
        </div>
    </div>
