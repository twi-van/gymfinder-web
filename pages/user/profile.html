<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - GYMFINDER</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <style>
        .profile-readonly-field {
            background-color: transparent !important;
            border: none !important;
            padding-left: 0 !important;
            font-weight: 500;
            color: #1e293b;
        }
        .profile-edit-field {
            background-color: #f8f9fa !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 0.375rem;
            padding-left: 0.75rem !important;
        }
        .goal-checkbox-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 100%;
        }
        .goal-checkbox-card:hover {
            border-color: #00c9b1;
            background-color: #f0fdfa;
        }
        .goal-checkbox-input:checked + .goal-checkbox-card {
            border-color: #00c9b1;
            background-color: #f0fdfa;
        }
        .goal-checkbox-input:checked + .goal-checkbox-card .goal-icon {
            color: #00c9b1 !important;
        }
        .goal-checkbox-input:checked + .goal-checkbox-card .goal-text {
            color: #00c9b1 !important;
            font-weight: 600;
        }
        .goal-checkbox-input:disabled + .goal-checkbox-card {
            opacity: 0.7;
            cursor: default;
        }
        .goal-checkbox-input:disabled + .goal-checkbox-card:hover {
            border-color: #e2e8f0;
            background-color: transparent;
        }
        .goal-checkbox-input:checked:disabled + .goal-checkbox-card {
            border-color: #00c9b1;
            background-color: #f0fdfa;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header -->
    <div id="header"></div>
    <script>window.ROOT_PATH = '../../';</script>
    <script src="../../assets/js/load-components.js"></script>

    <!-- Main Content -->
    <main class="flex-grow-1 py-5">
        <div class="container" id="profileContent" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <h2 class="fw-bold text-dark mb-4 text-center">HỒ SƠ CÁ NHÂN</h2>
                    <p class="text-center text-secondary mb-4">Quản lý thông tin cá nhân của bạn</p>
                    
                    <div class="bg-white rounded-4 p-4 p-md-5 shadow-sm border mb-4">
                        <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom">
                            <div class="position-relative">
                                <img src="" alt="Avatar" width="96" height="96" class="rounded-circle shadow-sm" id="profileAvatar" style="object-fit: cover;">
                                <button type="button" class="btn btn-primary rounded-circle shadow-sm d-none edit-only-element" id="btnChangeAvatar" style="position: absolute; bottom: 0; right: 0; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center;">
                                    <i class="fa-solid fa-camera small"></i>
                                </button>
                                <input type="file" id="inputAvatarFile" class="d-none" accept=".jpg, .jpeg, .png, .webp">
                            </div>
                            <div class="flex-grow-1">
                                <h4 class="fw-bold mb-1" id="profileNameDisplay">Đang tải...</h4>
                                <div class="text-secondary mb-2" id="profileEmailDisplay">Đang tải...</div>
                                <div id="avatarError" class="text-danger small fw-medium d-none mt-1"></div>
                                <button type="button" class="btn btn-sm btn-link text-danger p-0 text-decoration-none d-none edit-only-element mt-1 fw-medium" id="btnRemoveAvatar">
                                    <i class="fa-solid fa-trash-can me-1"></i>Xóa ảnh
                                </button>
                            </div>
                        </div>

                        <form id="profileForm">
                            <!-- THÔNG TIN CÁ NHÂN -->
                            <h5 class="fw-bold text-dark mb-3">Thông tin cá nhân</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-medium text-secondary small mb-1">Họ và tên</label>
                                    <input type="text" class="form-control profile-readonly-field" id="inputName" readonly>
                                    <div class="invalid-feedback">Họ tên không được để trống.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-secondary small mb-1">Số điện thoại</label>
                                    <input type="tel" class="form-control profile-readonly-field" id="inputPhone" readonly>
                                    <div class="invalid-feedback">Số điện thoại không hợp lệ.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-secondary small mb-1">Email (Không thể thay đổi)</label>
                                    <input type="email" class="form-control profile-readonly-field" id="inputEmail" readonly disabled>
                                </div>
                            </div>

                            <hr class="my-4 text-light">

                            <!-- MỤC TIÊU TẬP LUYỆN -->
                            <h5 class="fw-bold text-dark mb-3">Mục tiêu tập luyện</h5>
                            <div id="goalsFeedback" class="text-danger small mb-2 d-none">Vui lòng chọn ít nhất 1 mục tiêu tập luyện.</div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <input type="checkbox" class="btn-check goal-checkbox-input" id="goal_weight_loss" value="weight_loss" disabled>
                                    <label class="w-100 goal-checkbox-card d-flex align-items-center gap-3" for="goal_weight_loss">
                                        <i class="fa-solid fa-fire text-secondary fs-5 goal-icon"></i>
                                        <span class="text-dark fw-medium goal-text">Giảm cân / Giảm mỡ</span>
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="checkbox" class="btn-check goal-checkbox-input" id="goal_muscle_gain" value="muscle_gain" disabled>
                                    <label class="w-100 goal-checkbox-card d-flex align-items-center gap-3" for="goal_muscle_gain">
                                        <i class="fa-solid fa-dumbbell text-secondary fs-5 goal-icon"></i>
                                        <span class="text-dark fw-medium goal-text">Tăng cơ</span>
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="checkbox" class="btn-check goal-checkbox-input" id="goal_strength" value="strength" disabled>
                                    <label class="w-100 goal-checkbox-card d-flex align-items-center gap-3" for="goal_strength">
                                        <i class="fa-solid fa-hand-fist text-secondary fs-5 goal-icon"></i>
                                        <span class="text-dark fw-medium goal-text">Tăng sức mạnh</span>
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="checkbox" class="btn-check goal-checkbox-input" id="goal_health" value="health" disabled>
                                    <label class="w-100 goal-checkbox-card d-flex align-items-center gap-3" for="goal_health">
                                        <i class="fa-solid fa-heart-pulse text-secondary fs-5 goal-icon"></i>
                                        <span class="text-dark fw-medium goal-text">Cải thiện sức khỏe</span>
                                    </label>
                                </div>
                            </div>

                            <hr class="my-4 text-light">

                            <!-- ACTIONS -->
                            <div class="d-flex justify-content-end gap-2" id="viewActions">
                                <button type="button" class="btn btn-outline-primary rounded-pill px-4 fw-semibold" id="btnEditProfile">
                                    <i class="fa-solid fa-pen me-2"></i>Chỉnh sửa hồ sơ
                                </button>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 d-none" id="editActions">
                                <button type="button" class="btn btn-light text-secondary border rounded-pill px-4 fw-semibold" id="btnCancelEdit">
                                    Hủy
                                </button>
                                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold" id="btnSaveProfile">
                                    <i class="fa-solid fa-check me-2"></i>Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- TÀI KHOẢN -->
                    <div class="bg-white rounded-4 p-4 p-md-5 shadow-sm border text-center">
                        <h5 class="fw-bold text-dark mb-4 text-start">Tài khoản</h5>
                        <button type="button" class="btn btn-outline-danger px-5 py-2 fw-semibold rounded-pill btn-logout">
                            <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Đăng xuất
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core UI & Auth -->
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/ui.js"></script>
    
    <!-- Page Logic -->
    <script src="../../assets/js/pages/profile.js"></script>
</body>
</html>
