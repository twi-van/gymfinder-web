<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm  KIÊM - GYMFINDER</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <style>
        .filter-section {
            background-color: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
            position: sticky;
            top: 90px;
        }
        .filter-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group {
            margin-bottom: 24px;
        }
        .filter-group-title {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 12px;
        }
        .gym-card {
            background-color: #fff;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .gym-card:hover {
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            transform: translateY(-5px);
            border-color: #e2e8f0;
        }
        .gym-card-img {
            height: 200px;
            position: relative;
        }
        .gym-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gym-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .btn-heart {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .btn-heart:hover, .btn-heart.active {
            color: #ef4444;
        }
        .page-title-section {
            background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
            padding: 60px 0 40px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 40px;
            text-align: center;
        }
        .search-bar-wrapper {
            background: #fff;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #f1f5f9;
        }
        .search-input {
            border: none;
            box-shadow: none;
            padding: 12px 20px;
            font-size: 15px;
            background: transparent;
            flex-grow: 1;
        }
        .search-input:focus {
            box-shadow: none;
            outline: none;
        }
        .tag-pill {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        .form-check-label {
            font-size: 14px;
            color: #475569;
        }
        .page-link {
            color: #475569;
            border: none;
            margin: 0 4px;
            border-radius: 8px;
            font-weight: 500;
        }
        .page-item.active .page-link {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 201, 177, 0.3);
        }
        .page-link:hover:not(.active) {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }
        @media (max-width: 991.98px) {
            .filter-section {
                position: static;
            }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <div id="header"></div>
    <script>window.ROOT_PATH = '../../';</script>
    <script src="../../assets/js/load-components.js"></script>

    <!-- Page Title & Search Bar -->
    <div class="page-title-section">
        <div class="container">
            <h1 class="hero-title text-uppercase">
                TÌM KIẾM <span class="text-primary position-relative">
                    PHÒNG TẬP
                    <svg class="position-absolute w-100 bottom-0 start-0 translate-middle-y text-primary opacity-50" style="height: 10px;" viewBox="0 0 100 10" preserveAspectRatio="none">
                        <path d="M0 5 Q 50 10 100 5" stroke="currentColor" stroke-width="4" fill="transparent"></path>
                    </svg>
                </span> CỦA BẠN
            </h1>
            <p class="text-secondary mb-5" style="font-size: 16px;">Khám phá và tìm phòng tập phù hợp với nhu cầu của bạn tại TP. Hồ Chí Minh.</p>
            
            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass text-secondary ms-3"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm tên phòng tập, khu vực...">
                <button id="btnSearch" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold" style="font-size: 14px;">Tìm kiếm</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container pb-5">
        <div class="row">
            
            <!-- Filter Sidebar -->
            <div class="col-lg-3">
                <!-- Mobile Filter Toggle -->
                <button class="btn btn-white border shadow-sm w-100 d-lg-none mb-3 d-flex justify-content-between align-items-center fw-semibold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#filterSidebar">
                    <span><i class="fa-solid fa-bars me-2"></i> Bộ lọc</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="collapse d-lg-block" id="filterSidebar">
                    <div class="filter-section">
                        <div class="filter-title">
                            <i class="fa-solid fa-sliders text-primary"></i> Bộ lọc
                        </div>

                        <!-- Khu vực -->
                        <div class="filter-group">
                            <div class="filter-group-title">Khu vực</div>
                            <select class="form-select form-select-sm border-0 bg-light" name="district" id="districtFilter" style="font-size: 14px;">
                                <option value="">Tất cả khu vực</option>
                                <option value="Quận 1">Quận 1</option>
                                <option value="Quận 3">Quận 3</option>
                                <option value="Quận 4">Quận 4</option>
                                <option value="Quận 5">Quận 5</option>
                                <option value="Quận 6">Quận 6</option>
                                <option value="Quận 7">Quận 7</option>
                                <option value="Quận 8">Quận 8</option>
                                <option value="Quận 10">Quận 10</option>
                                <option value="Quận 11">Quận 11</option>
                                <option value="Quận 12">Quận 12</option>
                                <option value="Bình Tân">Bình Tân</option>
                                <option value="Bình Thạnh">Bình Thạnh</option>
                                <option value="Gò Vấp">Gò Vấp</option>
                                <option value="Phú Nhuận">Phú Nhuận</option>
                                <option value="Tân Bình">Tân Bình</option>
                                <option value="Tân Phú">Tân Phú</option>
                                <option value="TP Thủ Đức">TP Thủ Đức</option>
                                <option value="Huyện Bình Chánh">Huyện Bình Chánh</option>
                                <option value="Huyện Cần Giờ">Huyện Cần Giờ</option>
                                <option value="Huyện Củ Chi">Huyện Củ Chi</option>
                                <option value="Huyện Hóc Môn">Huyện Hóc Môn</option>
                                <option value="Huyện Nhà Bè">Huyện Nhà Bè</option>
                            </select>
                        </div>

                        <!-- Khoảng giá -->
                        <div class="filter-group">
                            <div class="filter-group-title">Khoảng giá (VNĐ/tháng)</div>
                            <div class="d-flex align-items-center gap-2">
                                <input type="number" id="priceMin" class="form-control form-control-sm text-center" placeholder="Từ" style="font-size: 13px;">
                                <span class="text-secondary">-</span>
                                <input type="number" id="priceMax" class="form-control form-control-sm text-center" placeholder="Đến" style="font-size: 13px;">
                            </div>
                        </div>

                        <!-- Đánh giá -->
                        <div class="filter-group">
                            <div class="filter-group-title">Đánh giá</div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="rating" id="rating0" checked>
                                <label class="form-check-label" for="rating0">Tất cả</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="rating" id="rating45" value="4.5">
                                <label class="form-check-label" for="rating45">4.5 <i class="fa-solid fa-star text-warning" style="font-size: 10px;"></i> trở lên</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="rating" id="rating40" value="4.0">
                                <label class="form-check-label" for="rating40">4.0 <i class="fa-solid fa-star text-warning" style="font-size: 10px;"></i> trở lên</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="rating" id="rating30" value="3.0">
                                <label class="form-check-label" for="rating30">3.0 <i class="fa-solid fa-star text-warning" style="font-size: 10px;"></i> trở lên</label>
                            </div>
                        </div>

                        <!-- Đặc điểm phòng tập -->
                        <div class="filter-group">
                            <div class="filter-group-title">Đặc điểm phòng tập</div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat1" value="1">
                                <label class="form-check-label" for="cat1">Gym phổ thông</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat2" value="2">
                                <label class="form-check-label" for="cat2">Gym cao cấp</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat3" value="3">
                                <label class="form-check-label" for="cat3">Mở cửa 24/7</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat5" value="5">
                                <label class="form-check-label" for="cat5">Có huấn luyện viên (PT)</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat7" value="7">
                                <label class="form-check-label" for="cat7">Dành cho nữ</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-category" type="checkbox" id="cat8" value="8">
                                <label class="form-check-label" for="cat8">Hỗ trợ giảm cân</label>
                            </div>
                        </div>

                        <!-- Tiện ích -->
                        <div class="filter-group">
                            <div class="filter-group-title">Tiện ích</div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity1">
                                <label class="form-check-label" for="amenity1">Xông hơi khô</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity2">
                                <label class="form-check-label" for="amenity2">Xông hơi ướt</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity3">
                                <label class="form-check-label" for="amenity3">Locker</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity4">
                                <label class="form-check-label" for="amenity4">Bãi đỗ xe</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity5">
                                <label class="form-check-label" for="amenity5">Điều hòa</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="amenity6">
                                <label class="form-check-label" for="amenity6">Phòng tắm</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="amenity7">
                                <label class="form-check-label" for="amenity7">Nước uống miễn phí</label>
                            </div>
                        </div>

                        <button id="btnFilter" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold mb-2" style="font-size: 14px;">Lọc kết quả</button>
                        <a href="search.html" id="btnClearFilter" class="btn btn-light w-100 rounded-3 py-2 text-secondary fw-semibold" style="font-size: 14px;">Xóa bộ lọc</a>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="col-lg-9">
                
                <!-- Active Filter Chips Container -->
                <div id="activeFilterChipsContainer" class="d-none mb-4 d-flex flex-wrap gap-2 align-items-center">
                    <span class="text-secondary fw-semibold me-2" style="font-size: 14px;">Đang lọc:</span>
                    <div id="activeFilterChips" class="d-flex flex-wrap gap-2"></div>
                    <button id="btnClearAllFilters" class="btn btn-sm btn-link text-decoration-none text-danger fw-semibold ms-2" style="font-size: 13px;">Xóa tất cả</button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h2 class="fw-bold text-dark m-0" style="font-size: 16px;" id="resultCountText">... phòng tập được tìm thấy</h2>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-secondary" style="font-size: 14px;">Sắp xếp:</span>
                        <select class="form-select form-select-sm border-0 bg-white shadow-sm fw-medium text-dark" style="font-size: 14px; width: auto; border-radius: 8px;">
                            <option>Phổ biến nhất</option>
                            <option>Đánh giá cao nhất</option>
                            <option>Giá thấp → cao</option>
                            <option>Giá cao → thấp</option>
                        </select>
                    </div>
                </div>

                <!-- Gym Cards Grid -->
                <div class="row g-4 mb-5" id="gymsListingContainer">
                    <!-- Cards will be populated by gym-search.js -->
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation" class="mb-5">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1" aria-disabled="true"><i class="fa-solid fa-arrow-left me-2"></i> Trước</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">4</a></li>
                        <li class="page-item"><a class="page-link" href="#">5</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Sau <i class="fa-solid fa-arrow-right ms-2"></i></a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

        <!-- Footer -->
            <!-- Footer -->
        <!-- Footer -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Data -->
    <script src="../../data/gyms.js"></script>
    <script src="../../data/categories.js"></script>
    
    <!-- Core & Helpers -->
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/ui.js"></script>
    
    <!-- Page Logic -->
    <script src="../../assets/js/pages/gym-search.js"></script>
    
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const keyword = urlParams.get('keyword');
            if (keyword) {
                $('.search-input').val(keyword);
            }
        });
    </script>
</body>
</html>
