<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huấn luyện viên - GYMFINDER</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <style>
        .page-title-section {
            background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
            padding: 60px 0 40px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 40px;
            text-align: center;
        }
        .trainer-card {
            transition: all 0.3s ease;
        }
        .trainer-card:hover {
            box-shadow: 0 15px 30px rgba(0,0,0,0.08) !important;
            transform: translateY(-5px);
            border-color: #e2e8f0 !important;
        }
        .btn-trainer-favorite:hover {
            color: #ef4444 !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <div id="header"></div>
    <script>window.ROOT_PATH = '../../';</script>
    <script src="../../assets/js/load-components.js"></script>

    <!-- Page Title & Search Bar -->
    <div class="page-title-section">
        <div class="container">
            <h1 class="hero-title text-uppercase">
                ĐỘI NGŨ <span class="text-primary position-relative">
                    HUẤN LUYỆN VIÊN
                    <svg class="position-absolute w-100 bottom-0 start-0 translate-middle-y text-primary opacity-50" style="height: 10px;" viewBox="0 0 100 10" preserveAspectRatio="none">
                        <path d="M0 5 Q 50 10 100 5" stroke="currentColor" stroke-width="4" fill="transparent"></path>
                    </svg>
                </span> TẠI CÁC PHÒNG TẬP
            </h1>
            <p class="text-secondary mb-5" style="font-size: 16px;">Khám phá các huấn luyện viên giàu kinh nghiệm đang làm việc tại các hệ thống phòng gym để giúp bạn đạt được mục tiêu.</p>
            
            <div class="bg-white rounded-4 p-4 shadow-sm mx-auto border" style="max-width: 1000px;">
                <form id="trainerSearchForm">
                    <!-- Row 1: Search -->
                    <div class="d-flex align-items-center bg-light rounded-pill px-3 py-2 mb-3 border">
                        <i class="fa-solid fa-magnifying-glass text-secondary mx-2"></i>
                        <input type="text" class="form-control border-0 shadow-none bg-transparent px-2" name="keyword" placeholder="Tìm kiếm tên, chuyên môn...">
                    </div>
                    
                    <!-- Row 2: Select Filters -->
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-3">
                            <select class="form-select border-0 shadow-sm bg-light rounded-pill px-3 py-2 text-secondary w-100" name="specialization">
                                <option value="">Chuyên môn: Tất cả</option>
                                <option value="Tăng cơ">Tăng cơ</option>
                                <option value="Giảm cân">Giảm cân</option>
                                <option value="Cải thiện vóc dáng">Cải thiện vóc dáng</option>
                                <option value="Kickboxing">Kickboxing</option>
                                <option value="HIIT">HIIT</option>
                                <option value="Yoga">Yoga</option>
                                <option value="Pilates">Pilates</option>
                                <option value="Trị liệu">Trị liệu</option>
                                <option value="Zumba">Zumba</option>
                                <option value="Thể hình">Thể hình</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <select class="form-select border-0 shadow-sm bg-light rounded-pill px-3 py-2 text-secondary w-100" name="location">
                                <option value="">Khu vực: Tất cả</option>
                                <option value="Quận 1">Quận 1</option>
                                <option value="Quận 3">Quận 3</option>
                                <option value="Quận 4">Quận 4</option>
                                <option value="Quận 5">Quận 5</option>
                                <option value="Quận 6">Quận 6</option>
                                <option value="Quận 7">Quận 7</option>
                                <option value="Quận 8">Quận 8</option>
                                <option value="Quận 10">Quận 10</option>
                                <option value="Quận 11">Quận 11</option>
                                <option value="Quận 12">Quận 12</option>
                                <option value="Bình Tân">Bình Tân</option>
                                <option value="Bình Thạnh">Bình Thạnh</option>
                                <option value="Gò Vấp">Gò Vấp</option>
                                <option value="Phú Nhuận">Phú Nhuận</option>
                                <option value="Tân Bình">Tân Bình</option>
                                <option value="Tân Phú">Tân Phú</option>
                                <option value="TP Thủ Đức">TP Thủ Đức</option>
                                <option value="Huyện Bình Chánh">Huyện Bình Chánh</option>
                                <option value="Huyện Cần Giờ">Huyện Cần Giờ</option>
                                <option value="Huyện Củ Chi">Huyện Củ Chi</option>
                                <option value="Huyện Hóc Môn">Huyện Hóc Môn</option>
                                <option value="Huyện Nhà Bè">Huyện Nhà Bè</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <select class="form-select border-0 shadow-sm bg-light rounded-pill px-3 py-2 text-secondary w-100" name="experience">
                                <option value="">Kinh nghiệm: Tất cả</option>
                                <option value="3">3+ năm</option>
                                <option value="5">5+ năm</option>
                                <option value="7">7+ năm</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <select class="form-select border-0 shadow-sm bg-light rounded-pill px-3 py-2 text-secondary w-100" name="rating">
                                <option value="">Đánh giá: Tất cả</option>
                                <option value="4.5">4.5★ trở lên</option>
                                <option value="4.0">4.0★ trở lên</option>
                                <option value="3.0">3.0★ trở lên</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Row 3: Actions -->
                    <div class="d-flex justify-content-center justify-content-md-end gap-3 pt-2 border-top">
                        <button type="button" class="btn btn-light text-secondary rounded-pill px-4 py-2 fw-semibold border shadow-sm mt-3" id="btnClearFilters">Xóa bộ lọc</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-semibold shadow-sm mt-3">Áp dụng lọc</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container pb-5">
        <div class="row g-4" id="trainerListContainer">
            <!-- Trainers injected by trainer.js -->
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" class="mt-5">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link border-0 fw-semibold text-secondary" href="#" tabindex="-1" aria-disabled="true"><i class="fa-solid fa-arrow-left me-2"></i> Trước</a>
                </li>
                <li class="page-item active"><a class="page-link border-0 rounded-3 mx-1 bg-primary text-white" href="#">1</a></li>
                <li class="page-item"><a class="page-link border-0 rounded-3 mx-1 text-dark" href="#">2</a></li>
                <li class="page-item"><a class="page-link border-0 rounded-3 mx-1 text-dark" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link border-0 fw-semibold text-dark" href="#">Sau <i class="fa-solid fa-arrow-right ms-2"></i></a>
                </li>
            </ul>
        </nav>
    </div>

        <!-- Footer -->
            <!-- Footer -->
        <!-- Footer -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Data -->
    <script src="../../data/gyms.js"></script>
    <script src="../../data/trainers.js"></script>
    
    <!-- Core & Helpers -->
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/ui.js"></script>
    
    <!-- Page Logic -->
    <script src="../../assets/js/pages/trainer.js"></script>
</body>
</html>
